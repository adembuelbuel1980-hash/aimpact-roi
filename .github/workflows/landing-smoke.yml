name: Aimpact landing smoke checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/smoke_landing.py'
      - '.github/workflows/landing-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/smoke_landing.py'
      - '.github/workflows/landing-smoke.yml'

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate landing page guardrails
        run: python scripts/smoke_landing.py
