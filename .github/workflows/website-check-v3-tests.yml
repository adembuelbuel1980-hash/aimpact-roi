name: Website-Check V3 security tests

on:
  push:
    branches:
      - feature/visibility-check-v2-20261010
  pull_request:
    paths:
      - 'functions/api/website-check*.js'
      - 'website-check-v3-neu.html'
      - 'tests/website-check-security.test.mjs'

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Turnstile security and PageSpeed API contract
        run: node --test tests/website-check-security.test.mjs
